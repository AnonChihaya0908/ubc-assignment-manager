name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run logic tests
        run: npm test

      - name: Run browser integration tests
        run: npm run test:browser

  macos-core:
    name: macOS core tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run logic tests
        run: npm test

      - name: Build macOS desktop App
        run: bash macos/build-app.sh "$(command -v node)" "$RUNNER_TEMP/UBC作业管理工具.app"

  macos-packages:
    name: macOS ${{ matrix.arch }} release archives
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and inspect unsigned PKG, DMG and ZIP
        run: bash macos/build-release.sh "${{ matrix.arch }}" "$RUNNER_TEMP/packages"

      - name: Install and launch package in runner session
        run: bash macos/smoke-installed-app.sh "$RUNNER_TEMP/packages/"*.pkg

      - name: Save all release archives and SHA-256 files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}-preview
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error

  macos-sonoma:
    name: macOS Sonoma 14 Apple Silicon launch
    needs: macos-packages
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the macOS 15 built Apple Silicon package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-arm64-preview
          path: ${{ runner.temp }}/packages

      - name: Install and launch on Sonoma
        run: bash macos/smoke-installed-app.sh "$RUNNER_TEMP/packages/"*.pkg
