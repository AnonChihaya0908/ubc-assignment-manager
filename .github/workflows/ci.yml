name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run logic tests
        run: npm test

      - name: Run browser integration tests
        run: npm run test:browser

      - name: Build Windows installer and portable archive
        run: npm run build:app

      - name: Verify Windows release checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          foreach ($name in @("ubc-assignment-manager-$version-setup.exe", "ubc-assignment-manager-$version-windows.zip")) {
            $artifact = Join-Path release $name
            $checksum = "$artifact.sha256"
            if (-not (Test-Path -LiteralPath $artifact) -or -not (Test-Path -LiteralPath $checksum)) {
              throw "Missing Windows release file: $name"
            }
            $line = (Get-Content -LiteralPath $checksum -Raw).Trim()
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$' -or $Matches[2] -ne $name) {
              throw "Invalid checksum file: $checksum"
            }
            if ((Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1]) {
              throw "Checksum mismatch: $name"
            }
          }

      - name: Save Windows release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: windows-release
          path: |
            release/ubc-assignment-manager-*-setup.exe
            release/ubc-assignment-manager-*-setup.exe.sha256
            release/ubc-assignment-manager-*-windows.zip
            release/ubc-assignment-manager-*-windows.zip.sha256
          if-no-files-found: error

  macos-core:
    name: macOS core tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run logic tests
        run: npm test

      - name: Build macOS desktop App
        run: bash macos/build-app.sh "$(command -v node)" "$RUNNER_TEMP/UBC作业管理工具.app"

  macos-packages:
    name: macOS ${{ matrix.arch }} release archives
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and inspect unsigned PKG, DMG and ZIP
        run: bash macos/build-release.sh "${{ matrix.arch }}" "$RUNNER_TEMP/packages"

      - name: Install and launch package in runner session
        run: bash macos/smoke-installed-app.sh "$RUNNER_TEMP/packages/"*.pkg

      - name: Save all release archives and SHA-256 files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}-release
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error

  macos-sonoma:
    name: macOS Sonoma 14 Apple Silicon launch
    needs: macos-packages
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the macOS 15 built Apple Silicon package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macos-arm64-release
          path: ${{ runner.temp }}/packages

      - name: Install and launch on Sonoma
        run: bash macos/smoke-installed-app.sh "$RUNNER_TEMP/packages/"*.pkg

      - name: Verify distributed App signature and inspect Gatekeeper
        run: |
          app="/Applications/UBC作业管理工具.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          dmg=("$RUNNER_TEMP/packages/"*.dmg)
          test "${#dmg[@]}" -eq 1
          mkdir "$RUNNER_TEMP/mounted-dmg"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$RUNNER_TEMP/mounted-dmg" "${dmg[0]}"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/mounted-dmg/UBC作业管理工具.app"
          hdiutil detach "$RUNNER_TEMP/mounted-dmg" -quiet
          echo '--- Gatekeeper assessment ---'
          spctl --assess --type execute --verbose=4 "$app" 2>&1 || true
          echo '--- Distribution check ---'
          syspolicy_check distribution "$app" 2>&1 || true
